[project]
name = "maplelens"
version = "0.1.0"
description = "Screen-reading-only overlay for MapleStory Classic."
readme = "README.md"
license = "MIT"
authors = [{ name = "or-keren" }]
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
